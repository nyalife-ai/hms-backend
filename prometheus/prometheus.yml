################################################################################
# prometheus/prometheus.yml
#
# PURPOSE:
# Core Prometheus configuration. Defines global settings, alerting rule files,
# the Alertmanager connection, and scrape targets for the application and
# supporting infrastructure.
#
# NOTE: Prometheus does NOT substitute environment variables inside this file.
# Values such as external_labels must be literal. Manage per-environment
# variations with separate config files or a templating step in your deploy
# pipeline (e.g., envsubst, Helm, Kustomize).
################################################################################

global:
  # How frequently to scrape targets by default
  scrape_interval: 15s
  # How frequently to evaluate rules
  evaluation_interval: 15s
  # Timeout for scraping targets before considering them failed
  scrape_timeout: 10s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  # Set 'environment' per deployment (development/staging/production).
  external_labels:
    environment: development
    app: api

# ============================================================================
# ALERTING
# ============================================================================
rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# ============================================================================
# SCRAPE CONFIGURATIONS
# ============================================================================
scrape_configs:

  # --------------------------------------------------------------------------
  # TARGET 1: The API service
  # Exposes metrics via GET /metrics (using prom-client)
  # --------------------------------------------------------------------------
  - job_name: "api"
    static_configs:
      # Use the docker service name (e.g., 'api:3000') in compose,
      # or 'localhost:3000' if running locally outside docker.
      - targets:
          - "api:3000"
    metrics_path: /metrics
    scrape_interval: 10s
    # If the application protects /metrics with a bearer token, configure:
    # authorization:
    #   credentials_file: /etc/prometheus/secrets/metrics-token
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # --------------------------------------------------------------------------
  # TARGET 2: Prometheus Self-Monitoring
  # --------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # --------------------------------------------------------------------------
  # TARGET 3: Alertmanager Self-Monitoring
  # --------------------------------------------------------------------------
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # --------------------------------------------------------------------------
  # TARGET 4: Grafana Self-Monitoring (Optional)
  # --------------------------------------------------------------------------
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics

  # --------------------------------------------------------------------------
  # TARGET 5: Node Exporter (Optional but Recommended for Production)
  # Uncomment and configure if you are running node_exporter to monitor
  # host-level metrics (CPU, Memory, Disk I/O, Network).
  # --------------------------------------------------------------------------
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
