################################################################################
# docker-compose.observability.yml
#
# PURPOSE:
# Observability stack: Prometheus, Alertmanager, Grafana, Elasticsearch,
# Logstash, Kibana, Filebeat.
#
# USAGE:
#   docker compose --env-file .env.observability \
#     -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# SECURITY NOTES:
# - All UI/API ports bind to 127.0.0.1 by default. Put a reverse proxy with
#   TLS + auth in front of anything that must be reachable externally.
# - Elasticsearch security (xpack) is disabled for local development only.
#   Enable it (plus TLS) before any shared or production deployment.
################################################################################

# Rotate container stdout/stderr logs so long-running stacks never fill the disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Defined in docker-compose.yml; declared here (not external) so both files
  # merge into the same project network when composed together.
  app-net:
  observability-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  elasticsearch-data:
  logstash-data:
  kibana-data:
  filebeat-data:
  # Shared with the application stack (also declared in docker-compose.yml).
  app-logs:

services:
  # ============================================================================
  # SERVICE: Prometheus (Metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    networks:
      - observability-net
      - app-net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      # Allows config reload via 'curl -X POST /-/reload' without a restart.
      - --web.enable-lifecycle
      # NOTE: --web.enable-admin-api is intentionally NOT set. It permits
      # destructive operations (deleting series, snapshots) and must never be
      # exposed on a production instance.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # SERVICE: Alertmanager (Alert Routing & Notification)
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    logging: *default-logging
    networks:
      - observability-net
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # SERVICE: Grafana (Dashboards)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    networks:
      - observability-net
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3100}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # SERVICE: Elasticsearch (Log Storage)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    logging: *default-logging
    networks:
      - observability-net
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      # DEVELOPMENT ONLY. Enable security + TLS for production deployments.
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=service-logs
      - node.name=service-es-01
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # SERVICE: Logstash (Log Pipeline)
  # ============================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash
    restart: unless-stopped
    logging: *default-logging
    # observability-net only — Filebeat reaches Logstash on this network;
    # do not join app-net (avoids exposing the Beats listener to the app tier).
    networks:
      - observability-net
    ports:
      # 5044: Beats protocol (Filebeat). Direct TCP JSON input is disabled.
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - logstash-data:/usr/share/logstash/data
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx512m
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:9600/_node/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ============================================================================
  # SERVICE: Kibana (Log Exploration)
  # ============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    restart: unless-stopped
    logging: *default-logging
    networks:
      - observability-net
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_NAME: kibana
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in .env.observability}
      TELEMETRY_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================================================
  # SERVICE: Filebeat (Log Shipper)
  # ============================================================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: filebeat
    restart: unless-stopped
    logging: *default-logging
    # Root is required to read /var/lib/docker/containers and the Docker socket.
    # Scope is reduced by mounting everything read-only.
    user: root
    # Reads mounted app logs + Docker socket; only needs observability-net
    # to reach Logstash (not app-net).
    networks:
      - observability-net
    environment:
      LOGSTASH_HOSTS: logstash:5044
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Persist the registry so restarts do not re-ship (duplicate) old logs.
      - filebeat-data:/usr/share/filebeat/data
      - app-logs:/app/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      logstash:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    command: filebeat -e -strict.perms=false
    healthcheck:
      test: ["CMD", "filebeat", "test", "output"]
      interval: 60s
      timeout: 15s
      retries: 3
