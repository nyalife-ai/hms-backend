################################################################################
# .github/workflows/cd.yml
#
# PURPOSE:
# Runs ONLY after the CI workflow passes on the main branch.
# Builds and pushes the Docker image to GitHub Container Registry (GHCR),
# then securely deploys it to the production server via SSH.
#
# The 'production' GitHub Environment gates this job: configure required
# reviewers / wait timers under Repo -> Settings -> Environments -> production.
#
# REQUIRED SECRETS (GitHub Repo -> Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST          : Server IP address or hostname
#   DEPLOY_USER          : SSH user (prefer a dedicated non-root deploy user)
#   DEPLOY_SSH_KEY       : Private SSH key (must match public key on server)
#   DEPLOY_APP_DIR       : Absolute path to the project on the server
#   DEPLOY_COMPOSE_SVC   : The service name in docker-compose.yml (e.g., 'app')
#
# SERVER-SIDE GHCR AUTH (do not pass GITHUB_TOKEN into the remote shell):
#   Expect the host to already be logged in to ghcr.io, or to provide
#   GHCR_USERNAME / GHCR_TOKEN (read-only package credentials) in the
#   deploy user's environment for `docker login`.
#
# NOTE: GITHUB_TOKEN is used only on the Actions runner for GHCR push
# (packages: write permission below).
################################################################################

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only proceed if the triggering CI workflow was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          # Build exactly the commit that passed CI, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Resolve immutable image tag"
        id: image
        run: |
          echo "tag=ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: "Generate Image Metadata (tags + OCI labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: "Build and Push Docker Image"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          provenance: true

  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    environment: production
    steps:
      - name: "Deploy to Server via SSH"
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image-tag }}
          DEPLOY_COMPOSE_SVC: ${{ secrets.DEPLOY_COMPOSE_SVC }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # Pass IMAGE into the remote shell via envs — never inline GITHUB_TOKEN.
          envs: IMAGE,DEPLOY_COMPOSE_SVC
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"

            # Prefer server-side read-only GHCR credentials when present;
            # otherwise assume the host is already authenticated to ghcr.io.
            if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            docker pull "${IMAGE}"
            IMAGE="${IMAGE}" docker compose pull "${DEPLOY_COMPOSE_SVC}"
            IMAGE="${IMAGE}" docker compose up -d --no-deps "${DEPLOY_COMPOSE_SVC}"

            docker image prune -f
            echo "Deployed image ${IMAGE} at $(date)"

      - name: "Post-Deployment Health Check"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Retry the health endpoint for up to ~60s to survive slow cold starts.
            # Adjust URL/port to match your service configuration.
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3000/public/health > /dev/null; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for service to become healthy ($i/12)..."
              sleep 5
            done
            echo "Health check FAILED after 60s." >&2
            exit 1
