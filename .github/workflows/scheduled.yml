################################################################################
# .github/workflows/scheduled.yml
#
# PURPOSE:
# Runs automated maintenance tasks on a schedule to keep the repository
# healthy, secure, and free of technical debt.
#
# NOTE: All jobs are generic and can be copied to any Node.js/NestJS project.
################################################################################

name: Scheduled Maintenance

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Dependency Audit
  # Checks for outdated packages and creates a summary.
  # ============================================================================
  dependency-audit:
    name: "Check Outdated Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: "List outdated packages"
        run: yarn outdated || true # '|| true' prevents the workflow from failing if packages are outdated
      - name: "Run yarn audit"
        run: yarn audit --level moderate || true

  # ============================================================================
  # JOB 2: Stale PR and Issue Cleanup
  # Automatically labels and closes stale pull requests and issues.
  # ============================================================================
  stale-cleanup:
    name: "Close Stale PRs and Issues"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Stale PR settings
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs."
          close-pr-message: "This PR was closed because it has been stalled for 7 days with no activity."
          # Stale Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: "This issue is stale because it has been open for 60 days with no activity."
          close-issue-message: "This issue was closed because it has been inactive for 14 days since being marked as stale."
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,security,work-in-progress"

  # ============================================================================
  # JOB 3: Weekly Deep Security Scan (Optional)
  # Runs a deeper Snyk scan that might be too slow for regular CI.
  #
  # NOTE: The 'secrets' context is NOT available in job-level 'if' conditions,
  # so the token presence check must happen in a step. If SNYK_TOKEN is not
  # configured, the scan is skipped gracefully.
  # ============================================================================
  deep-security-scan:
    name: "Deep Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Check whether Snyk is configured"
        id: snyk-check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN not configured; skipping deep scan."
          fi
      - uses: actions/checkout@v4
        if: steps.snyk-check.outputs.enabled == 'true'
      - name: "Run Snyk to check for vulnerabilities"
        if: steps.snyk-check.outputs.enabled == 'true'
        # Pin to immutable commit SHA (snyk/actions master @ 2024-era verified tip)
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
