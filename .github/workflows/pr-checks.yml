################################################################################
# .github/workflows/pr-checks.yml
#
# PURPOSE:
# Lightweight, fast checks that run on every pull request to provide immediate
# feedback to developers. Designed to finish in under 3 minutes.
################################################################################

name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: "TypeScript Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: "Type check (no emit)"
        run: yarn tsc --noEmit

  lint-changed:
    name: "Lint Changed Files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff against base branch
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: "Lint changed TypeScript files"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --name-only -z --diff-filter=ACMRT "origin/${BASE_REF}...HEAD" \
            | grep -zE '\.ts$' \
            | grep -vzE '\.d\.ts$' \
            | grep -vzE '\.spec\.ts$' \
            > changed.ts.list || true
          if [ ! -s changed.ts.list ]; then
            echo "No changed TypeScript source files to lint."
            exit 0
          fi
          # NUL-delimited list + xargs -0 avoids shell injection from filenames
          xargs -0 -r yarn eslint --max-warnings=0 < changed.ts.list

  pr-title:
    name: "PR Title Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: "Check PR title follows conventional commits"
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          requireScope: false

  # Blocks PRs that introduce dependencies with known vulnerabilities or
  # disallowed licenses. Uses the GitHub Advisory Database.
  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
