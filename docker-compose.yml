################################################################################
# docker-compose.yml
#
# PURPOSE:
# Core application stack: NestJS API, PostgreSQL, and Redis.
#
# USAGE:
#   docker compose up -d
################################################################################

version: '3.9'

networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  app-logs:

services:
  # ============================================================================
  # SERVICE: Application (NestJS API)
  # ============================================================================
  app:
    image: ${IMAGE:-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_NAME: api
    volumes:
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The hardened runtime image intentionally contains no curl/wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/public/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    labels:
      logging: "true"

  # ============================================================================
  # SERVICE: PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_pass}
      POSTGRES_DB: ${DB_NAME:-api_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app_user} -d ${DB_NAME:-api_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  # ============================================================================
  # SERVICE: Redis (Cache & Queues)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: api-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net