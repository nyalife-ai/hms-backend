################################################################################
# logstash/pipeline/api.conf
#
# PURPOSE:
# Ingests structured JSON logs from the application via Filebeat (Beats
# protocol, port 5044), parses and enriches the data, redacts sensitive
# information, and outputs to Elasticsearch using a daily index pattern.
#
# Direct TCP input is intentionally disabled — unauthenticated log injection
# on an open port is a production risk. Ship logs only through Filebeat.
#
# NOTE: This pipeline is project-agnostic. Adjust the 'redact' and 'enrich'
# sections based on your specific application's log schema.
################################################################################

input {
  # ============================================================================
  # INPUT: Beats (Filebeat)
  # Filebeat ships events using the Beats (lumberjack) protocol — a plain TCP
  # input CANNOT decode it. This must be a 'beats' input.
  # ============================================================================
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  # ============================================================================
  # FILTER 1: Drop empty or whitespace-only messages
  # ============================================================================
  if [message] == "" or [message] =~ /^\s+$/ {
    drop {}
  }

  # ============================================================================
  # FILTER 2: Map application fields to Elastic Common Schema (ECS) names.
  # Bracket notation ([log][level]) creates properly nested objects; quoted
  # dotted names would create misleading flat fields instead.
  # ============================================================================
  mutate {
    rename => {
      "level"    => "[log][level]"
      "context"  => "[service][name]"
      "pid"      => "[process][pid]"
      "hostname" => "[host][name]"
    }
    add_field => {
      "app"         => "api"
      "environment" => "${ENVIRONMENT:development}"
    }
  }

  # ============================================================================
  # FILTER 3: Normalize log level strings
  # ============================================================================
  if [log][level] == "verbose" {
    mutate { update => { "[log][level]" => "debug" } }
  }

  # ============================================================================
  # FILTER 4: Parse HTTP request fields if present in the log payload
  # ============================================================================
  if [http] {
    if [http][method] {
      mutate { rename => { "[http][method]" => "[http][request][method]" } }
    }
    if [http][status_code] {
      mutate {
        rename  => { "[http][status_code]" => "[http][response][status_code]" }
        convert => { "[http][response][status_code]" => "integer" }
      }
    }
    if [http][url] {
      mutate { rename => { "[http][url]" => "[url][path]" } }
    }
    if [http][duration_ms] {
      mutate { convert => { "[http][duration_ms]" => "float" } }
    }
  }

  # ============================================================================
  # FILTER 5: Tag domain events (e.g., transactions, audits)
  # ============================================================================
  if [transaction] or [audit] {
    mutate {
      add_tag => ["business_event"]
    }
  }

  # ============================================================================
  # FILTER 6: Redact sensitive fields (CRITICAL for compliance, e.g., GDPR)
  # Extend this list to match every credential or PII field your app can log.
  # ============================================================================
  mutate {
    remove_field => [
      "[payload][password]",
      "[payload][password_hash]",
      "[payload][refresh_token]",
      "[payload][access_token]",
      "[extra][api_key]",
      "[http][headers][authorization]",
      "[http][headers][cookie]"
    ]
  }

  # ============================================================================
  # FILTER 7: Parse and normalize the timestamp
  # ============================================================================
  if [timestamp] {
    date {
      match        => ["timestamp", "ISO8601"]
      target       => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ============================================================================
  # FILTER 8: GeoIP enrichment on client IP address
  # ============================================================================
  if [ip_address] and [ip_address] != "127.0.0.1" and [ip_address] != "::1" {
    geoip {
      source => "ip_address"
      target => "geo"
      # Optional: specify fields to keep to save disk space
      # fields => ["city_name", "country_name", "region_name", "location"]
    }
  }
}

output {
  # ============================================================================
  # OUTPUT: Elasticsearch
  # Daily index pattern matches the Grafana datasource config: [api-logs-]YYYY.MM.DD
  # and the Kibana index pattern: api-logs-*
  # ============================================================================
  elasticsearch {
    hosts  => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index  => "api-logs-%{+YYYY.MM.dd}"
    action => "index"

    # ========================================================================
    # INDEX LIFECYCLE MANAGEMENT (ILM)
    # Uncomment and configure when using Elastic Stack with X-Pack enabled.
    # This automatically rolls over and deletes old indices to save disk space.
    # ========================================================================
    # ilm_enabled        => true
    # ilm_rollover_alias => "api-logs"
    # ilm_policy         => "api-logs-30d"
  }

  # ============================================================================
  # OUTPUT: Stdout (Debugging only)
  # Uncomment to inspect parsed events in the Logstash container logs.
  # DO NOT leave enabled in production (causes severe performance degradation).
  # ============================================================================
  # stdout { codec => rubydebug }
}
